[default_config]
version = "0.10.1"
assembler = "nasm"
instruction_set = "x86-64"

[default_config.opts]
compiler = "nasm"
compile_flags_txt = ["-f", "elf64", "-o", "bin/"]
diagnostics = true
default_diagnostics = false

[[project]]
path = "./src/window.asm"
version = "0.10.1"
assembler = "nasm"
instruction_set = "x86-64"

[project.opts]
compile_flags_txt = ["-f", "elf64", "-o", "bin/window.o"]
